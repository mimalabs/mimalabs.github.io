"},"infoPages":{"about":{"title":"Sobre MIMA LABS","intro":"Libros creativos para ayudar a los más pequeños a colorear, imaginar y crear.","sections":[{"heading":"Por qué existimos","body":"Creemos que un libro de actividades puede ir más allá de colorear. Nuestras colecciones conectan temas, estaciones y celebraciones y pueden crecer con nuevas edades y actividades."},{"heading":"Creatividad revisada por personas","body":"Usamos herramientas creativas, incluida la IA generativa, para explorar ideas. Cada actividad publicada es revisada, seleccionada y refinada por una persona."},{"heading":"Lo que viene después","body":"Colorear es el comienzo. Los próximos libros podrán añadir dibujo, detalles por completar y retos sencillos de imaginación."}]},"faq":{"title":"Preguntas frecuentes","intro":"Respuestas rápidas sobre los libros, la compra y cómo creamos.","sections":[{"heading":"¿Dónde puedo comprar los libros?","body":"Elige un libro aquí y te llevaremos al Amazon correspondiente. El pago, envío y devoluciones se gestionan en Amazon."},{"heading":"¿Para qué edades son?","body":"Las primeras colecciones son para 1–3 años. Más adelante habrá nuevas edades, siempre indicadas claramente en cada producto."},{"heading":"¿Los libros están hechos con IA?","body":"La IA generativa es una de nuestras herramientas creativas. Una persona revisa y refina cada actividad antes de publicarla."},{"heading":"¿Recogéis datos de niños?","body":"No. La web está dirigida a padres y cuidadores y no tiene cuentas, comentarios ni formularios para niños. La analítica se limita al uso agregado de la web."}]},"privacy":{"title":"Política de privacidad","intro":"Última actualización: 16 de septiembre de 2026. Esta política explica cómo MIMA LABS trata los datos cuando usas este sitio.","sections":[{"heading":"Responsable","body":"MIMA LABS, Suurstoffi 13b, Rotkreuz, Zug, Suiza. Contacto: info.mimalabs@gmail.com."},{"heading":"Qué recogemos","body":"No hay registro de cuentas, newsletter ni formulario de contacto. Usamos analítica respetuosa con la privacidad para conocer de forma agregada visitas a páginas, interés por productos, idioma, categoría de dispositivo, fuente de referencia y clics hacia Amazon. No usamos estos datos para publicidad comportamental ni perfiles entre sitios."},{"heading":"Analítica","body":"La analítica opcional solo se carga después de que la aceptes en el aviso de privacidad. La integración actual está preparada para Plausible Analytics y se utiliza únicamente para medición agregada interna y mejora. Tu elección se recuerda localmente en tu dispositivo."},{"heading":"Niños","body":"Los libros son para niños, pero este sitio comercial está dirigido a padres y cuidadores. No pedimos deliberadamente a menores nombres, correos, fotos, ubicación precisa ni otros datos personales directos. La analítica se limita a medición interna del sitio."},{"heading":"Enlaces externos","body":"Al abrir un producto en Amazon abandonas MIMA LABS. Amazon tratará entonces la información conforme a sus propias políticas de privacidad y cookies. MIMA LABS no controla ese tratamiento."},{"heading":"Tus derechos","body":"Según dónde vivas, la ley aplicable puede darte derechos de información, acceso, rectificación, supresión, limitación, oposición o reclamación ante una autoridad de control. Puedes contactar con nosotros en la dirección indicada arriba."},{"heading":"Cambios","body":"Podemos actualizar esta política si cambia el sitio, la analítica o la normativa aplicable. Actualizaremos la fecha superior cuando lo hagamos."}]},"cookies":{"title":"Política de cookies","intro":"MIMA LABS guarda una pequeña preferencia para recordar tu elección de privacidad. La analítica opcional solo se carga si aceptas.","sections":[{"heading":"Nuestro sitio","body":"Las funciones necesarias del sitio funcionan sin analítica opcional. Guardamos tu elección localmente para no preguntarte en cada visita. Si rechazas, la analítica opcional permanece desactivada."},{"heading":"Si esto cambia","body":"Si en el futuro incorporamos tecnología que almacene o lea información no esencial en tu dispositivo —por ejemplo ciertos vídeos embebidos, herramientas publicitarias o analítica basada en cookies— actualizaremos esta política y añadiremos controles de consentimiento cuando sean necesarios antes de activarla."},{"heading":"Amazon","body":"Al hacer clic en un enlace de Amazon vas a un sitio externo. Amazon puede usar cookies o tecnologías similares según sus propias políticas. MIMA LABS no coloca esas tecnologías antes de que abandones este sitio."}]},"legal":{"title":"Aviso legal","intro":"Información del operador y datos importantes sobre este sitio.","sections":[{"heading":"Operador del sitio","body":"MIMA LABS · Suurstoffi 13b, Rotkreuz, Zug, Suiza · info.mimalabs@gmail.com."},{"heading":"Cómo funcionan las compras","body":"MIMA LABS no celebra actualmente contratos de venta ni procesa pagos en este sitio. Los botones de producto son enlaces externos a Amazon. Disponibilidad, precio final, impuestos, envío, pago, entrega, devoluciones y el contrato de compraventa se gestionan en el marketplace de Amazon y/o por el vendedor mostrado allí."},{"heading":"Herramientas creativas y transparencia sobre IA","body":"MIMA LABS puede usar IA generativa junto con otras herramientas digitales creativas durante la ideación y la producción. La revisión humana sigue formando parte del proceso: los conceptos y materiales generados se revisan, seleccionan y refinan antes de publicarse."},{"heading":"Propiedad intelectual","body":"Salvo indicación contraria, la marca MIMA LABS, los textos del sitio, los diseños originales y los contenidos de libros publicados están protegidos por la normativa aplicable de propiedad intelectual. Los nombres y marcas de terceros pertenecen a sus respectivos titulares. Amazon es un marketplace externo y no es el operador de MIMA LABS."},{"heading":"Información externa","body":"Intentamos mantener la información de producto malabs@gmail.com indicando qué intentabas hacer y qué dispositivo o tecnología de asistencia utilizabas."}]}},"contact":{"eyebrow":"Contacto","title":"¿Una idea para pequeños creadores?","body":"Preguntas, feedback o colaboraciones. Escríbenos.","cta":"Escribir a MIMA LABS","note":"Sin formularios — solo email."},"cookieConsent":{"title":"Tu privacidad, sin complicaciones","body":"Recordamos tu elección. La analítica opcional solo se carga si aceptas.","acceptAll":"Aceptar","essentialOnly":"Rechazar","learnMore":"Política de cookies","manage":"Preferencias de cookies"}},"fr":{"meta":{"title":"MIMA LABS — Des livres créatifs pour les petites imaginations","description":"Des livres créatifs pour colorier, imaginer et créer."},"nav":{"products":"Livres","reviews":"Avis","about":"À propos","faq":"FAQ","language":"Langue","contact":"Contact"},"common":{"explore":"Découvrir les livres","viewAll":"Voir tous les livres","viewAmazon":"Voir sur Amazon","previous":"Précédent","next":"Suivant","comingSoon":"Bientôt","age":"Âge","rating":"Note","backHome":"Retour à MIMA LABS","externalLink":"Ouvre un site externe","comingSoonEdition":"Cette édition linguistique arrive bientôt.","backToTop":"Retour en haut"},"hero":{"slide1":{"eyebrow":"Petites mains. Grande imagination.","title":"Colorie. Imagine. Crée.","body":"Des livres créatifs pour petites mains et grandes idées.","cta":"Découvrir les livres"},"slide2":{"eyebrow":"Une bibliothèque qui grandit","title":"Plus de thèmes. Plus de créativité.","body":"Ferme, Halloween et Noël ne sont que le début.","cta":"Voir tous les livres"}},"products":{"eyebrow":"Nos livres","title":"Choisir un univers à explorer","intro":"Des collections qui grandissent avec de nouveaux thèmes, âges et activités.","growingLabel":"Bibliothèque en croissance","roadmapTitle":"La suite arrive","roadmapBody":"Nouvelles saisons, nouveaux âges et nouvelles façons de colorier, dessiner et imaginer.","roadmapTags":["Nouvelles saisons","Nouveaux âges","Colorier + de lage entre sites."},{"heading":"Mesure d’audience","body":"Ce site est préparé pour Plausible Analytics, un service de statistiques sans cookies. Lorsqu’il est activé, il sert uniquement à la mesure interne et à l’amélioration. L’intégration vise à éviter les identifiants persistants, les profils publicitaires et le suivi intersites. La configuration de production et les conditions du fournisseur doivent être vérifiées avant lancement."},{"heading":"Enfants","body":"Les livres sont destinés aux enfants, mais ce site commercial s’adresse aux parents et aux personnes qui s’en occupent. Nous ne demandons pas sciemment aux enfants leur nom, e-mail, photo, position précise ou autres informations personnelles directes. La mesure d’audience est limitée à l’analyse interne du site."},{"heading":"Liens externes","body":"Lorsque vous ouvrez un produit sur Amazon, vous quittez MIMA LABS. Amazon traite alors les informations selon ses propres politiques de confidentialité et de cookies. MIMA LABS ne contrôle pas ce traitement."},{"heading":"Vos droits","body":"Selon votre lieu de résidence, la loi applicable peut vous accorder des droits d’information, d’accès, de rectification, d’effacement, de limitation, d’opposition ou de réclamation auprès d’une autorité de contrôle. Contactez-nous à l’adresse ci-dessus pour exercer une demande."},{"heading":"Modifications","body":"Nous pouvons mettre cette politique à jour si le site, l’outil de mesure ou les exigences légales changent. La date en haut de page sera alors mise à jour."}]},"cookies":{"title":"Politique relative aux cookies","intro":"MIMA LABS conserve une petite préférence pour mémoriser votre choix de confidentialité. Les analyses optionnelles ne se chargent qu’après acceptation.","sections":[{"heading":"Notre site","body":"Les fonctions nécessaires du site fonctionnent sans analyses optionnelles. Nous mémorisons votre choix localement afin de ne pas vous le redemander à chaque visite. Si vous refusez, les analyses optionnelles restent désactivées."},{"heading":"Si cela change","body":"Si nous ajoutons plus tard une technologie qui stocke ou lit des informations non essentielles sur votre appareil — par exemple certains lecteurs vidéo intégrés, outils publicitaires ou statistiques avec cookies — nous mettrons cette politique à jour et ajouterons les contrôles de consentement requis avant activation."},{"heading":"Amazon","body":"Un clic vers Amazon vous conduit à un site externe. Amazon peut utiliser des cookies ou technologies similaires conformément à ses propres politiques. MIMA LABS ne dépose pas ces technologies avant votre départ de ce site."}]},"legal":{"title":"Mentions légales","intro":"Informations sur l’exploitant et éléments importants concernant ce site.","sections":[{"heading":"Exploitant du site","body":"MIMA LABS · Suurstoffi 13b, Rotkreuz, Zug, Suisse · info.mimalabs@gmail.com."},{"heading":"Fonctionnement des achats","body":"MIMA LABS ne conclut actuellement aucun contrat de vente et ne traite aucun paiement sur ce site. Les boutons produit sont des liens externes vers Amazon. Disponibilité, prix final, taxes, livraison, paiement, retours et contrat de vente sont gérés sur la place de marché Amazon visitée et/ou par le vendeur qui y est indiqué."},{"heading":"Outils créatifs et transparence IA","body":"MIMA LABS peut utiliser l’IA générative avec d’autres outils créatifs numériques pendant l’idéation et la production. La vérification humaine reste partie intégrante du processus : les concepts et éléments générés sont contrôlés, sélectionnés et affinés avant publication."},{"heading":"Propriété intellectuelle","body":"Sauf indication contraire, la marque MIMA LABS, les textes du site, les mises en page originales et le contenu publié des livres sont protégés par les lois applicables en matière de propriété intellectuelle. Les noms et marques de tiers appartiennent à leurs propriétaires. Amazon est une place de marché tierce et n’est pas l’exploitant de MIMA LABS."},{ é esistiamo","body":"Un libro di attività può essere più di un semplice libro da colorare. Le nostre collezioni collegano temi, stagioni e feste e possono crescere con nuove età e attività."},{"heading":"Creatività rivista da persone","body":"Usiamo strumenti creativi, inclusa l’IA generativa, per esplorare idee. Ogni attività pubblicata viene controllata, selezionata e rifinita da una persona."},{"heading":"Cosa viene dopo","body":"Colorare è l’inizio. I prossimi libri potranno aggiungere disegno, dettagli da completare e semplici spunti di immaginazione."}]},"faq":{"title":"Domande frequenti","intro":"Risposte rapide su libri, acquisto e come creiamo.","sections":[{"heading":"Dove posso comprare i libri?","body":"Scegli un libro qui e ti porteremo al marketplace Amazon corretto. Pagamento, spedizione e resi avvengono su Amazon."},{"heading":"Per quali età sono pensati?","body":"Le prime collezioni sono per 1–3 anni. In futuro arriveranno altre fasce d’età, sempre indicate chiaramente su ogni prodotto."},{"heading":"I libri sono creati con l’IA?","body":"L’IA generativa è uno dei nostri strumenti creativi. Una persona controlla e rifinisce ogni attività prima della pubblicazione."},{"heading":"Raccogliete dati dei bambini?","body":"No. Il sito è rivolto a genitori e caregiver e non offre account, commenti o moduli per bambini. Le analisi sono limitate all’uso aggregato del sito."}]},"privacy":{"title":"Informativa sulla privacy","intro":"Ultimo aggiornamento: 16 settembre 2026. Questa informativa spiega come MIMA LABS tratta i dati durante l’uso del sito.","sections":[{"heading":"Titolare","body":"MIMA LABS, Suurstoffi 13b, Rotkreuz, Zug, Svizzera. Contatto: info.mimalabs@gmail.com."},{"heading":"Cosa raccogliamo","body":"Il sito non prevede registrazione account, newsletter o modulo di contatto. Usiamo analisi rispettose della privacy per comprendere in modo aggregato visite alle pagine, interesse per i prodotti, lingua, categoria di dispositivo, fonte di provenienza e clic verso Amazon. Non usiamo questi dati per pubblicità comportamentale o profilazione tra siti."},{"heading":"Analytics","body":"Le analisi facoltative vengono caricate solo dopo il consenso nel banner privacy. L’integrazione attuale è predisposta per Plausible Analytics ed è usata solo per misurazioni aggregate interne e miglioramento. La tua scelta viene ricordata localmente sul dispositivo."},{"heading":"Bambini","body":"I libri sono per bambini, ma questo sito commerciale è rivolto a genitori e caregiver. Non chiediamo consapevolmente ai bambini nomi, email, foto, posizione precisa o altri dati personali diretti. Le analisi sono limitate alla misurazione interna del sito."},{"heading":"Link esterni","body":"Quando apri un prodotto su Amazon lasci MIMA LABS. Amazon tratta quindi le informazioni secondo le proprie politiche privacy e cookie. MIMA LABS non controlla tale trattamento."},{"heading":"I tuoi diritti","body":"A seconda del luogo in cui vivi, la legge applicabile può riconoscerti diritti di informazione, accesso, rettifica, cancellazione, limitazione, opposizione o reclamo presso un’autorità di controllo. Contattaci all’indirizzo sopra per una richiesta privacy."},{"heading":"Modifiche","body":"Possiamo aggiornare questa informativa se cambiano il sito, l’assetto analytics o i requisiti legali. In tal caso aggiorneremo la data in alto."}]},"cookies":{"title":"Informativa cookie","intro":"MIMA LABS salva una piccola preferenza per ricordare la tua scelta privacy. Le analisi facoltative si caricano solo se accetti.","sections":[{"heading":"Il nostro sito","body":"Le funzioni necessarie del sito funzionano senza analisi facoltative. Salviamo localmente la tua scelta per non chiedertela a ogni visita. Se rifiuti, le analisi facoltative restano disattivate."},{"heading":"Se questo cambierà","body":"Se in futuro introdurremo tecnologie che memorizzano o leggono informazioni non essenziali sul dispositivo — ad esempio certi video incorporati, strumenti pubblicitari o analytics basati su cookie — aggiorneremo questa informativa e aggiungeremo i controlli di consenso richiesti prima dell’attivazione."},{"heading":"Amazon","body":"Cliccando un link Amazon vai su un sito esterno. Amazon può usare cookie o tecnologie simili secondo le proprie politiche. Tali tecnologie non vengono impostate da MIMA LABS prima che tu lasci questo sito."}]},"legal":{"title":"Note legali","intro":"Informazioni sull’operatore e aspetti importanti relativi a questo sito.","sections":[{"heading":"Operatore del sito","body":"MIMA LABS · Suurstoffi 13b, Rotkreuz, Zug, Svizzera · info.mimalabs@gmail.com."},{"heading":"Come funzionano gli acquisti","body":"MIMA LABS al momento non conclude contratti di vendita né elabora pagamenti su questo sito. I pulsanti prodotto sono link esterni ad Amazon. Disponibilità, prezzo finale, tasse, spedizione, pagamento, consegna, resi e contratto di vendita sono gestiti sul marketplace Amazon visitato e/o dal venditore indicato lì."},{"heading":"Strumenti creativi e trasparenza sull’IA","body":"MIMA LABS può usare IA generativa insieme ad altri strumenti creativi digitali durante ideazione e produzione. La revisione umana resta parte del processo di pubblicazione: concetti e materiali generati vengono verificati, selezionati e rifiniti prima del rilascio."},{"heading":"Proprietà intellettuale","body":"Salvo diversa indicazione, il marchio MIMA LABS, i testi del sito, i layout originali e i contenuti pubblicati dei libri sono protetti dalle leggi applicabili sulla proprietà intellettuale. Nomi e marchi di terzi appartengono ai rispettivi titolari. Amazon è un marketplace terzo e non è l’operatore di MIMA LABS."},{"heading":"Informazioni esterne","body":"Cerchiamo di mantenere accurate le informazioni sui prodotti, ma la pagina Amazon è la fonte finale per le informazioni d’acquisto al momento della transazione. I siti esterni sono gestiti indipendentemente da MIMA LABS."}]},"terms":{"title":"Termini d’uso","intro
