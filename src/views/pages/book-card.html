<article class="book-card" id="book-{{bookId}}" aria-labelledby="book-title-{{bookId}}">
      <div class="book-cover-panel {{panelTheme}}"><span class="cover-decoration" aria-hidden="true">✺</span>{{coverHtml}}</div>
      <div class="book-information"><div class="book-micro"><span>{{theme}}</span><span>{{detailLabel}} {{age}}</span></div>
      <h3 id="book-title-{{bookId}}">{{headingHtml}}</h3><p>{{description}}</p><div class="book-cta-row">{{buyHtml}}</div></div></article>
