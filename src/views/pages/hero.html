<section id="home" class="hero-section" aria-labelledby="hero-title"><div class="container hero-grid">
  <div class="hero-content"><span class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>{{eyebrow}}</span>
  <h1 id="hero-title">{{heroTitle}}</h1><p class="hero-description">{{heroBody}}</p>
  {{discoverLink}}
  <div class="hero-note"><span class="hero-note-mark" aria-hidden="true">✦</span>{{newLabel}}</div>
  </div><div class="hero-stage" aria-label="{{productsTitle}}"><div class="hero-sun" aria-hidden="true"></div>
  <span class="hero-scribble hero-scribble-one" aria-hidden="true">✦</span><span class="hero-scribble hero-scribble-two" aria-hidden="true">✧</span>
  {{heroBooks}}<span class="stage-badge" aria-hidden="true">✦<span>MIMA</span></span>
  </div></div><div class="container hero-meta" aria-label="{{introLabel}}">{{features}}</div></section>
