<aside id="cookie-consent" class="cookie-banner" role="region" aria-label="{{title}}" hidden>
  <div class="cookie-banner-copy"><strong>{{title}}</strong><p>{{body}}</p><a href="{{cookieLink}}">{{learnMore}}</a></div>
  <div class="cookie-banner-actions"><button type="button" class="cookie-button-secondary" data-consent-choice="essential">{{essentialOnly}}</button>
  <button type="button" class="cookie-button-primary" data-consent-choice="all">{{acceptAll}}</button></div></aside>
